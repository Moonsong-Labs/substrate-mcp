# RPC Endpoints Configuration for Substrate MCP
# This file defines the available RPC endpoints for connecting to Substrate-based chains

[[endpoints]]
name = "local"
url = "http://127.0.0.1:9944"
description = "Local development node - typically used for testing with a locally running Substrate node"

[[endpoints]]
name = "polkadot"
url = "wss://rpc.polkadot.io"
description = "Polkadot mainnet - the main relay chain for the Polkadot ecosystem, providing shared security and interoperability"

[[endpoints]]
name = "kusama"
url = "wss://kusama-rpc.polkadot.io"
description = "Kusama network - Polkadot's canary network, used for testing new features before they go to Polkadot mainnet"

[[endpoints]]
name = "westend"
url = "wss://westend-rpc.polkadot.io"
description = "Westend testnet - Polkadot's primary test network for developers to test their parachains and applications"

[[endpoints]]
name = "rococo"
url = "wss://rococo-rpc.polkadot.io"
description = "Rococo testnet - a parachain test network focused on testing cross-chain message passing and parachain functionality"

[[endpoints]]
name = "paseo"
url = "wss://paseo.rpc.amforc.com"
description = "Paseo testnet - a community-run testnet that replaces the deprecated Rococo network"

# Asset Hub endpoints
[[endpoints]]
name = "asset-hub-polkadot"
url = "wss://polkadot-asset-hub-rpc.polkadot.io"
description = "Asset Hub on Polkadot - system parachain for managing assets on the Polkadot network"

[[endpoints]]
name = "asset-hub-kusama"
url = "wss://kusama-asset-hub-rpc.polkadot.io"
description = "Asset Hub on Kusama - system parachain for managing assets on the Kusama network"

[[endpoints]]
name = "asset-hub-westend"
url = "wss://westend-asset-hub-rpc.polkadot.io"
description = "Asset Hub on Westend - test version of Asset Hub for development and testing"

# Bridge Hub endpoints
[[endpoints]]
name = "bridge-hub-polkadot"
url = "wss://polkadot-bridge-hub-rpc.polkadot.io"
description = "Bridge Hub on Polkadot - system parachain for managing bridges to other networks"

[[endpoints]]
name = "bridge-hub-kusama"
url = "wss://kusama-bridge-hub-rpc.polkadot.io"
description = "Bridge Hub on Kusama - system parachain for managing bridges on Kusama"

# Collective endpoints
[[endpoints]]
name = "collectives-polkadot"
url = "wss://polkadot-collectives-rpc.polkadot.io"
description = "Collectives on Polkadot - system parachain for on-chain collectives and governance bodies"

[[endpoints]]
name = "collectives-westend"
url = "wss://westend-collectives-rpc.polkadot.io"
description = "Collectives on Westend - test version of the Collectives parachain"